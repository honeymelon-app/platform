name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

env:
    NODE_VERSION: '22'

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: lint

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - run: npm ci

            - name: Type check
              run: npm run typecheck

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: typecheck

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - run: npm ci

            - name: Build
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7
